name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and never cancel one half-done: the site that is
# live is whatever finished last.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # MkDocs 2.0 removes the plugin system this site uses, so the major is
      # pinned rather than tracked.
      - run: python -m pip install "mkdocs-material>=9,<10" "mkdocs<2"
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

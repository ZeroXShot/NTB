name: Release

# Tag a commit `v0.1.0` and this publishes it. The version in the tag must match
# src/ntb/__init__.py; the job checks that rather than trusting the tagger.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
        working-directory: apps/studio
      - run: npm run build
        working-directory: apps/studio
      - run: python -m pip install build
      - run: python -m build
      - name: The tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(python -c 'import re,pathlib; print(re.search(r"\"(.+?)\"", pathlib.Path("src/ntb/__init__.py").read_text().split("__version__")[1]).group(1))')"
          test "v$VERSION" = "${GITHUB_REF_NAME}" \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match version $VERSION"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Trusted publishing: no API token lives in this repository.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

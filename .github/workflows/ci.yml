name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Lint and types run once. They are platform-independent, so paying for nine
  # copies of them buys nothing.
  static:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[server,mcp]" ruff mypy pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is arm64; ubuntu and windows are x86_64. Between them the
        # matrix covers every architecture NTB claims to support, which is only
        # affordable because the wheel is pure Python.
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[server,mcp]" pytest
      - run: pytest -q

  # The backend tests are the ones that actually prove the emitters work: they
  # run the generated torch module and compare it against onnxruntime. Torch is
  # heavy, so this runs once rather than across the whole matrix.
  backends:
    name: torch, keras and onnx parity
    runs-on: ubuntu-latest
    # Keras 3 defaults to TensorFlow, which NTB does not depend on. Running it
    # on torch keeps this job to one framework install.
    env:
      KERAS_BACKEND: torch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[onnx,keras]" pytest
      - run: pytest -q -m "torch or keras or onnx"
      - name: The emitted code must still match the golden files
        run: pytest -q tests/test_emit_torch.py tests/test_emit_keras.py

  # The frontend generates its types from schema/ntb-ir-v*.json, which is itself
  # generated from the pydantic models. If the checked-in copy drifts, the
  # studio starts lying about the IR -- so drift fails the build.
  schema:
    name: schema is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: ntb schema --check

  # The studio's IR types are generated from schema/ntb-ir-v1.json, which is
  # generated from the pydantic models. Drift means the editor is working from a
  # different idea of the IR than the server, so it fails the build.
  studio:
    name: studio builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - run: npm ci
        working-directory: apps/studio
      - run: npm run types:check
        working-directory: apps/studio
      - run: npx tsc --noEmit
        working-directory: apps/studio
      - run: npm run build
        working-directory: apps/studio
      - uses: actions/upload-artifact@v4
        with:
          name: studio-bundle
          path: src/ntb/_static

  # A wheel that imports on the dev machine but not from a clean install is the
  # classic packaging failure. Install the built artifact, not the source tree.
  wheel:
    name: wheel installs and runs on ${{ matrix.os }}
    needs: studio
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # The frontend is built once and packaged here; the wheel must never be
      # published without a UI inside it.
      - uses: actions/download-artifact@v4
        with:
          name: studio-bundle
          path: src/ntb/_static
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Wheel must be pure Python
        shell: bash
        run: |
          ls dist/
          test -n "$(ls dist/*-py3-none-any.whl 2>/dev/null)" \
            || { echo "::error::wheel is not py3-none-any; a native dependency crept in"; exit 1; }
      - name: Wheel must contain the studio bundle
        shell: bash
        run: |
          python -m zipfile -l dist/*.whl | grep -q "ntb/_static/index.html" || { echo "::error::the wheel has no studio bundle"; exit 1; }
      - name: Install from the wheel in a clean environment
        shell: bash
        run: |
          VENV="${RUNNER_TEMP:-/tmp}/ntb-venv"
          python -m venv "$VENV"
          if [ -d "$VENV/Scripts" ]; then BIN="$VENV/Scripts"; else BIN="$VENV/bin"; fi
          "$BIN/python" -m pip install --quiet "$(ls dist/*.whl)[server]"
          "$BIN/ntb" version
          "$BIN/ntb" ops
          "$BIN/ntb" validate examples/mlp.ntb
          "$BIN/ntb" info examples/vertical_tower.ntb
      - name: The studio must answer on a clean install
        shell: bash
        run: |
          VENV="${RUNNER_TEMP:-/tmp}/ntb-venv"
          if [ -d "$VENV/Scripts" ]; then BIN="$VENV/Scripts"; else BIN="$VENV/bin"; fi
          "$BIN/ntb" studio --no-open --port 8757 &
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8757/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8757/api/health
          curl -sf http://127.0.0.1:8757/ | grep -q "<title>NTB Studio</title>"
